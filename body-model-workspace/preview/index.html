<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB 本地验模（body-model-workspace）</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #1e293b; color: #e2e8f0; }
    #bar { padding: 12px 16px; background: #0f172a; }
    #c { width: 100vw; height: calc(100vh - 52px); display: block; }
    .hint { font-size: 14px; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="bar">
    <label>
      选择 .glb：
      <input type="file" accept=".glb,.gltf" id="file" />
    </label>
    <div class="hint">请在本目录执行 <code>python3 -m http.server 8080</code> 后用浏览器打开，避免 file:// 限制。</div>
  </div>
  <canvas id="c"></canvas>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8eef5);
    const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 100);
    camera.position.set(0, 1.2, 4);
    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.85);
    dir.position.set(5, 10, 7);
    scene.add(dir);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.8, 0);

    let mesh = null;
    function fit() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", fit);
    fit();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    document.getElementById("file").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const ab = ev.target.result;
        if (mesh) {
          scene.remove(mesh);
          mesh.traverse((o) => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) {
              const m = o.material;
              if (Array.isArray(m)) m.forEach((x) => x.dispose());
              else m.dispose();
            }
          });
          mesh = null;
        }
        const loader = new GLTFLoader();
        loader.parse(
          ab,
          "",
          (gltf) => {
            mesh = gltf.scene;
            scene.add(mesh);
            const box = new THREE.Box3().setFromObject(mesh);
            const c = new THREE.Vector3();
            const s = new THREE.Vector3();
            box.getCenter(c);
            box.getSize(s);
            mesh.position.sub(c);
            const d = Math.max(s.x, s.y, s.z, 0.001) * 2.2;
            camera.position.set(0, s.y * 0.2, d);
            controls.target.set(0, s.y * 0.15, 0);
            controls.update();
          },
          console.error
        );
      };
      reader.readAsArrayBuffer(f);
    });
  </script>
</body>
</html>
